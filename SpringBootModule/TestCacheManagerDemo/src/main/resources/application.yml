server:
  port: 8182

spring:
  datasource:
    # 本地db文件的路径
    url: jdbc:sqlite:d:/cache-test/cache_manager.db

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

logging:
  file:
    path: d:/cache-test/log/manager-server

user-config:
  # 保留的旧密钥数
  old-key-count: 1
  # 预生成的密钥数
  future-key-count: 1
  # 每隔多久应该生成一个新的密钥
  renew-frequency-sec: 600